name: reviewed-candidate-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-build:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_CANDIDATE_CHECKS_ENABLED == 'true'
    environment: candidate-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/release_check.py check --root .
      - run: python tools/release_check.py build --root . --dist dist
      - run: python tools/release_check.py verify --archive dist/cross-agent-memory-bridge-v1.0.0-source-candidate.zip
      - run: python tools/release_check.py verify --archive dist/cross-agent-memory-bridge-v1.0.0-install-candidate.zip
